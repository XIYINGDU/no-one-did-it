# 翻译决策日志 — 第 1 章《祭坛移动》
#
# 每条非显而易见的翻译决策均在此记录。
# 当某个术语译法在后续章节出问题，可一路追溯至此：
# 谁做的选择 → 为什么 → 审核结论 → 有无争议。

chapter: "01-the-altar-moves"
chapter_title_zh: "祭坛移动"
translator: claude (pilot)
glossary_version: "1.0.0-pilot"

decisions:

  # === 道德短句 / 节奏保留 ===

  - id: D01-001
    location: "开场场景 / He did not run."
    type: prose-choice
    decision: "译为「他没有跑」，三字短句"
    alternatives_considered:
      - "他并未逃跑"（四字，节奏拉长，丢失短促的戛然而止感）
      - "他没有逃"（丢失「跑」的动作具象感）
    rationale: "原文以三个词收束第一段叙事——这是道德转折的隐含信号。中文三字保留同等节奏权重。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass
    review_notes: "语域存活，三字对三词，review-2 确认通过"

  - id: D01-002
    location: "四千人破晓被捕 / A fire. A foreign communist. A conspiracy. A decree. A law. A new order."
    type: prose-choice
    decision: "译为六个平行短名词短语，不加连词"
    alternatives_considered:
      - "一场火灾、一个外国共产党人、一场阴谋……"（加入连词会破坏锤击节奏）
    rationale: "原文以六个短名词短语收束此段，形成锤击节奏。中文保留六句短促判断，不拉长，不加连词。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  # === 术语选择 ===

  - id: D01-003
    location: "题记 / 'throws his guilt on'"
    type: term-choice
    decision: "译为「将罪投于」而非「归罪于」"
    alternatives_considered:
      - "归罪于"（丢失了原文 throw 的物理投掷/转移动作隐喻）
    rationale: "保留原文的「投掷/转移」动作隐喻——这是全书「替代」概念的第一个文学锚点。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass
    review_notes: "review-1 备注：如后续章节将 scapegoating 作为过程动词使用，必须使用术语表规定的「替罪」"

  - id: D01-004
    location: "开场场景 / council communist"
    type: term-choice
    decision: "译为「委员会共产主义者」"
    alternatives_considered:
      - "苏维埃共产主义者"（不准确——council communist 特指反对列宁主义先锋党模式、主张工人委员会直接民主的流派）
      - "议会共产主义者"（council ≠ parliament）
    rationale: "政治学术语，指 1920-30 年代荷兰/德国的左翼共产主义流派。Glossary Master 裁决确认译法准确并锁定为术语表条目。Chinese Reader SOFT 发现'有短暂停顿'——属于精确术语的可接受认知成本。"
    decided_by: translator
    decided_at: 2026-06-10
    status: accepted
    glossary_master_ruling: "2026-06-10 — 译法准确。已加入 glossary.yml。翻译笔记已有解释，正文无需加注。"
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-005
    location: "四千人破晓被捕 / 'The fire was the match.'"
    type: term-choice
    decision: "译为「火就是火柴」"
    alternatives_considered:
      - "这把火就是引信"（解决了引爆点含义，但丢失了 match 双关的简洁力量）
      - "火就是那根火柴"（稍好但仍未完全传达双关）
    rationale: "保留原文简短有力的判断句形式。match 双关（火柴/引爆点）为源语言固有不可译性。Glossary Master 裁决：接受不可译性损失。双关的第二义（引爆点/导火索）在上文中可从语境推断——前文已说明火被用作起义信号。不需要读者面对的脚注。译者标注的 [AMBIGUOUS] 可解除。"
    decided_by: translator
    decided_at: 2026-06-10
    status: accepted
    glossary_master_ruling: "2026-06-10 — 接受不可译性损失。译文保持原状。上下文的推断足够支持读者理解。不添加读者面对的脚注/译注。"
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-006
    location: "廷代尔的山羊之词 / 'scapegoate' (Tyndale 1530 原始拼写)"
    type: term-choice
    decision: "保留英文原文 *scapegoate*，不翻译"
    alternatives_considered:
      - 翻译为中文（将丢失 Tyndale 造词的词源学意义——这是理解 scapegoat 来源的关键）
    rationale: "这是 Tyndale 1530 年创造的原始拼写，是词源学讨论的核心对象，不可翻译。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-007
    location: "廷代尔的山羊之词 / 'Azazel'"
    type: term-choice
    decision: "首次出现保留 *Azazel* + 括号注中文「阿撒泻勒」，后续可直接用「阿撒泻勒」"
    alternatives_considered:
      - 仅用中文「阿撒泻勒」（丢失希伯来文原词，对学术读者不友好）
    rationale: "遵循翻译规范：非英语术语首次出现保留原文并括号注中文。阿撒泻勒为中文圣经和合本约定译法。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-008
    location: "四千人破晓被捕 / 'alibi went into the record'"
    type: term-choice
    decision: "译为「托辞进入了记录」"
    alternatives_considered:
      - "不在场证明"（法律意义太重，丢失了本书中 alibi 的扩展含义）
    rationale: "本书中的 alibi 不是法律意义的「不在场证明」，而是为真正责任承担者提供掩护的叙事/程序/制度。术语表规定 alibi →「托辞」。译者标注 [TERM-NOTE] 说明双重含义在上下文中可被感知。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  # === 学术 / 法律术语 ===

  - id: D01-009
    location: "利未记、雅典、巴比伦、罗马 / 古代仪式术语 (pharmakos, kuppuru, mašmaššu, Februa, Luperci, Akitu)"
    type: term-choice
    decision: "保留原文转写 + 首次出现括号注中文解释"
    alternatives_considered:
      - 全部翻译为中文（丢失学术精确性，破坏多语言并行比较的结构）
      - 全部保留原文不加注释（对不读相关语言的读者不友好）
    rationale: "这些术语是该段论证的负载词——译者需要读者看到不同古代文明之间的平行语法。保留原文转写使比较结构可见，括号中文确保可读。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass
    review_notes: "Chinese Reader 冷读反馈：该段落外文术语密度高，阅读节奏放慢——属于可接受的学术精确性代价"

  - id: D01-010
    location: "一部为一个人制定的追溯性法律 / 德语法律名称"
    type: prose-choice
    decision: "保留德文原文斜体 + 首次出现括号注中文翻译。后续直接用中文简称。"
    alternatives_considered:
      - 仅用中文（丢失法律文件的精确引用）
    rationale: "这些是历史法律文件的正式名称，保留德文原文是学术引用规范。中文翻译遵循史学界约定译法。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-011
    location: "廷代尔的山羊之词 / 'critical edition'"
    type: term-choice
    decision: "译为「校订本」"
    alternatives_considered:
      - "评注本"（review-1 SOFT 发现：评注本 implies commentary，critical edition 是指从手稿源建立的学术版本）
      - "考订本"（同样可接受）
    rationale: "review-1 审核发现后从「评注本」修正为「校订本」。review-2 验证通过。"
    decided_by: reviewer (纠正) / translator (修正)
    decided_at: 2026-06-10
    revised_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass (修正后)

  - id: D01-012
    location: "廷代尔的山羊之词 / 'Anchor Bible commentary'"
    type: term-choice
    decision: "译为「锚圣经（Anchor Bible）注释」"
    alternatives_considered:
      - "锚圣经注释"（review-1 建议括注英文，因为 Anchor Bible 是已出版系列名称）
    rationale: "review-1 审核发现后从纯中文改为中英对照，保留系列名称的可识别性。Glossary Master 裁决确认此格式为标准化译法。Anchor Bible 和 Anchor Bible Dictionary 均已加入 glossary.yml 锁定。"
    decided_by: reviewer (建议) / translator (修改)
    decided_at: 2026-06-10
    revised_at: 2026-06-10
    status: accepted
    glossary_master_ruling: "2026-06-10 — 中英对照格式批准。已加入 glossary.yml 锁定。Anchor Bible Dictionary 按同一模式处理。"
    reviewed_by: reviewer
    review_outcome: pass

  # === 分析术语 ===

  - id: D01-013
    location: "祭坛移动 / 'the substitution does not'"
    type: prose-choice
    decision: "译为「替代没有消失」"
    alternatives_considered:
      - "替代不移动"（过于字面，且中文「移动」与「替代」不自然搭配）
      - "替代没有改变"（丢失与「祭坛移动了」的对比张力）
    rationale: "与「祭坛移动了」形成对比对仗。review-2 SOFT 发现：略有修辞偏移（强调「依然存在」而非「不移动」），但含义存活。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-014
    location: "莱比锡，2008 年 1 月 / 'partial interception'"
    type: term-choice
    decision: "译为「部分拦截」"
    rationale: "全书方法论术语——指对责任洗白模式的不完全阻断。保持技术术语的准确性和跨章节一致性。译者已标注 [TERM-NOTE]。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-015
    location: "结尾段落 / 'we are at the altar'"
    type: prose-choice
    decision: "译为「我们就在祭坛上」"
    alternatives_considered:
      - "我们站在祭坛前"（弱化了「在祭坛上」——即我们自己就是被献祭者的含义）
    rationale: "全书标题句的回响。「在祭坛上」暗示我们自己是替代品——而不仅仅是旁观者。这是第 1 章的道德压力点，必须保持其重量。review-2 语域审核确认存活。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  - id: D01-016
    location: "四千人破晓被捕 / 'the response was waiting'"
    type: prose-choice
    decision: "译为「回应早已准备就绪」"
    alternatives_considered:
      - "回应在等待"（过于直译，中文不自然）
    rationale: "全章核心论点句之一：无论谁纵火，纳粹的回应是准备好的。保留原文的等待隐喻，但以中文自然表达。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  # === 结构决策 ===

  - id: D01-017
    location: "全章 / 双语格式 (原文 → 译文 → 翻译笔记)"
    type: style-choice
    decision: "翻译稿使用双语格式：原文引用块 + 译文 + 翻译笔记。翻译笔记标注 [TERM-NOTE] 和 [AMBIGUOUS]。"
    rationale: "draft 阶段的格式便于 Reviewer 对照审核。进入 ready 前需剥离为纯中文格式。"
    decided_by: translator
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass
    review_notes: "review-1 备注：这是合法的 draft 阶段格式，不影响 in-review 推进，但 ready 前必须标准化"

  # === 推进决策 ===

  - id: D01-018
    location: "全章"
    type: promotion
    decision: "第 1 章从 draft 推进至 ready"
    rationale: |
      所有推进条件均已满足：
      - Translator：全章 523 行完整
      - Reviewer：review-2 PASS，0 HARD
      - Chinese Reader：冷读 PASS，0 HARD
      - Glossary Master：4 项裁决全部完成，glossary.yml 25 条目锁定
      - 所有发现（18/18）均已闭环：12 fixed、6 accepted_as_is、0 否决
      - 决策日志：17 条全部记录，review 验证通过
    decided_by: translation-director
    decided_at: 2026-06-10
    reviewed_by: N/A（导演推进决策不需要审核）
    review_outcome: N/A
    review_notes: |
      注意：双语格式（原文引用块 + 译文 + 翻译笔记）在 ready 阶段仍保留。
      该格式原为 draft/review 阶段设计，ready 前需要标准化为纯中文。
      因 Chinese Reader 已在该格式下完成冷读并 PASS，且标准化属于排版/合稿范围，
      不构成对 ready 推进的 HARD 阻塞。建议在合稿步骤（合入中文版章节文件）时处理。
    carry_forward: "格式标准化（双语 → 纯中文）— 合稿步骤处理"

