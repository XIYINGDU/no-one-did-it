  - id: D02-015
    location: "第330号法令与关怀的语言 / "dolus specialis""
    type: term-choice
    decision: "保留拉丁文 *dolus specialis*，括号注中文「特定故意」"
    alternatives_considered:
      - "特定故意"（纯中文——丢失了国际刑法中的拉丁文法律术语标准用法）
    rationale: ""dolus specialis"（特定故意）是灭绝种族罪（genocide）中要求的特定心理要素——行为人须有"消灭某一群体的特定意图"。在国际刑法中，该术语的拉丁文形式是标准用法。保留拉丁文+中文注释是法律学术翻译的标准做法。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  # === 历史/案例特定术语 ===

  - id: D02-016
    location: "1A区的几颗坏苹果 / "a few bad apples""
    type: term-choice
    decision: "译为「几颗坏苹果」"
    alternatives_considered:
      - "害群之马"（丢失了原文的"坏苹果"隐喻——这个成语在美国文化中有明确来源："one bad apple spoils the bunch"）
      - "个别败类"（过于道德化的隐喻）
    rationale: ""坏苹果"在中文语境中也是可理解的隐喻（一颗坏苹果毁掉整筐）。保留字面翻译使读者能看到原文的修辞来源。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
