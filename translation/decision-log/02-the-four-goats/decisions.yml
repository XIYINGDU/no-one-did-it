  - id: D02-018
    location: "德雷福斯、塞尔皮科、地平线、被偷走的一代 / 纳普委员会术语"meat eaters" / "grass eaters""
    type: term-choice
    decision: "译为「主动索贿者」/「被动受贿者」"
    alternatives_considered:
      - "肉食者/草食者"（字译——在中文中几乎不可理解）
      - "主动型/被动型"（丢失了纳普委员会原创术语的历史精确性）
    rationale: "纳普委员会的"meat eaters"指主动索贿、积极寻找腐败机会的警察；"grass eaters"指被动接受而非主动寻找贿赂的警察。中文无法直接保留这个比喻而不造成混乱。意译为「主动索贿者」/「被动受贿者」保留了功能性区分。标注[TERM-NOTE]说明此译法为意译而非字译。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: glossary-master
    review_outcome: pass
    glossary_ruling: "Glossary Master 裁决 2026-06-12 — 批准。功能意译准确，英文比喻不可在中文中保留。已在 glossary.yml 新增条目，要求首次出现时中英对照（`「主动索贿者」(meat eaters)`）。translation_strategy: source-metaphor-unrecoverable。"

  - id: D02-019
    location: "德雷福斯、塞尔皮科、地平线、被偷走的一代 / "pad system""
    type: term-choice
    decision: "译为「保护费制度」"
    alternatives_considered:
      - "贿赂制度"（丢失了"pad"的历史术语——纳普委员会使用的"pad"特指NYPD的特定贿赂系统）
      - "保护金制度"
    rationale: ""pad system"是纳普委员会调查中发现的纽约市警局系统性贿赂制度——警察收取"保护费"以换取不执法或提供保护。"保护费制度"准确传达了该制度的本质。该术语在中文语境中尚无参考文献，当前译法基于意译，待审核确认。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: glossary-master
    review_outcome: pass
    glossary_ruling: "Glossary Master 裁决 2026-06-12 — 批准。「保护费」的犯罪组织联想在此恰好服务于原意的准确传达——NYPD的 pad system 本质就是保护费勒索。已在 glossary.yml 新增条目，forbidden: [「贿赂制度」,「保护金制度」,「份子钱制度」]。无需首次出现中英对照。translation_strategy: functional-equivalent。"

  - id: D02-020
    location: "德雷福斯、塞尔皮科、地平线、被偷走的一代 / "Stolen Generations" / "Bringing Them Home""
    type: term-choice
    decision: "Stolen Generations → 「被偷走的一代」；Bringing Them Home → 《带他们回家》"
    rationale: ""被偷走的一代"是澳大利亚华人社群和中文媒体中对该历史的约定译法。"Bringing Them Home"译为《带他们回家》保持报告的英文原名含义，首次出现时用中英对照格式。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  # === 结构/风格决策 ===

  - id: D02-021
    location: "全章 / 结尾"辨认它。/诊断它。/行动。/避免成为它。""
    type: style-choice
    decision: "标题使用句号而非冒号或破折号：`## 辨认它。`、`## 诊断它。`、`## 行动。`、`## 避免成为它。`"
