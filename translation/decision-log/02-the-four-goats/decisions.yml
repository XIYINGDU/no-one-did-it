  - id: D02-017
    location: "1A区的几颗坏苹果 / "Gitmo-izing""
    type: term-choice
    decision: "译为「关塔那摩化」"
    alternatives_considered:
      - "Gitmo化"（中英混杂，不符合中文阅读习惯）
    rationale: ""Gitmo"是关塔那摩（Guantanamo）的俗称。中文"关塔那摩化"保留了原词的核心含义——将阿布格莱布的审讯操作"关塔那摩化"，即移植关塔那摩的审讯手法。作为新造词在上下文中可理解。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
