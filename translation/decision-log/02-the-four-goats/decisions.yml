# 翻译决策日志 — 第 2 章《四种山羊》

chapter: "02-the-four-goats"
chapter_title_zh: "四种山羊"
translator: claude
glossary_version: "1.0.0-pilot"

decisions:

  # === 分类术语（全章基石） ===

  - id: D02-001
    location: "四种分类表 / 四种山羊的命名"
    type: term-choice
    decision: "严格遵循 glossary.yml 锁定译法：pure scapegoat → 纯粹替罪羊，partial scapegoat → 部分替罪羊，system/object alibi → 系统/对象托辞，cost-bearing goat → 承担代价的山羊"
    alternatives_considered:
      - "无辜替罪羊"（glossary 已禁止）
      - "系统/物体不在场证明"（丢失了'alibi'在本书中的扩展含义——托辞是为真正责任承担者提供掩护的叙事/程序/制度）
    rationale: "全书四种分类的译法已在第 1 章翻译中由 Glossary Master 锁定。第 2 章是这四个术语首次同时出现的章节，严格使用锁定译法以确保全书一致性。"
    decided_by: glossary-master (锁定) / translator (执行)
    decided_at: 2026-06-10
    reviewed_by: reviewer
    review_outcome: pass

  # === 叙事术语 ===

  - id: D02-002
    location: "全章 / "install" 及 "installation""
    type: term-choice
    decision: "译为「安装」及「安装过程」"
    alternatives_considered:
      - "引入"（丢失了原文的机械/工具隐喻）
      - "建立"（过于泛泛）
    rationale: "本章的"安装"（install）是方法论术语——如同安装一件工具，本章将四种分类"安装"到读者的认知中，供全书使用。保留原文的机械安装隐喻。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: glossary-master
    review_outcome: pass
    glossary_ruling: "无需加入 glossary，为章节级比喻性用法而非全书术语。"

  - id: D02-003
    location: "全章 / "the alibi can climb the institutional stack""
    type: prose-choice
    decision: "译为「托辞可以登上制度的层级阶梯」"
    alternatives_considered:
      - "托辞可以在制度堆栈中攀升"（"堆栈"过于计算机术语化）
      - "托辞可以在制度层级中上升"（丢失了"stack"的堆栈隐喻）
    rationale: "全章关键论点句。"climb the stack"保留了计算机科学中"堆栈"（stack）的隐喻——托辞如同在堆栈中攀升，每层都可以容纳一个不同的托辞。中文"层级阶梯"使这个隐喻在非技术读者中也能存活。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: glossary-master
    review_outcome: pass
    glossary_ruling: "同意此译法建议。'层级阶梯'在非技术读者中保留了stack的层级递进隐喻，同时避免了'堆栈'的过度术语化。与 'recursion' → 「递归」的裁决一致——stack/层级阶梯 为 recursion/递归 铺垫了同一隐喻框架。"

  # === 机器/技术术语 ===

  - id: D02-004
    location: "操作员、机器、漏洞 / "hardware interlocks that had backstopped""
    type: prose-choice
    decision: "译为「硬件联锁——那些在早期Therac型号中曾为相同软件故障提供后盾的东西」"
    alternatives_considered:
      - "为相同软件故障提供后援的硬件联锁"（但"后援"不准确）
    rationale: ""backstop"在此意为提供后备/安全网。中文"提供后盾"保留了防御性/后备的含义。通过破折号解释性结构将长定语从句转换为独立说明。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  - id: D02-005
    location: "操作员、机器、漏洞 / "a containment""
    type: term-choice
    decision: "译为「一种封闭」"
    alternatives_considered:
      - "一种控制"（containment ≠ control，这里不是"控制"的含义）
      - "围堵"（偏军事/政治策略含义）
    rationale: "原文"containment"在此指将责任封闭在某一个层面、阻止其上升到更高层面的机制。中文"封闭"准确地表达了这种"关闭/封锁"的含义。译者标注[TERM-NOTE]说明。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  # === 法律/程序术语 ===

  - id: D02-006
    location: "从暂缓起诉到不起诉 / DPA / NPA / plea agreement"
    type: term-choice
    decision: "DPA → 暂缓起诉协议，NPA → 不起诉协议，plea agreement → 认罪协议"
    alternatives_considered:
      - "延期起诉协议"（"暂缓起诉"更常见于美国联邦司法语境）
      - "认罪协商协议"（plea agreement 的标准法律中文是"认罪协议"）
    rationale: "这些是美国联邦刑事司法中的标准术语，中文法律文献有约定译法。DPA（暂缓起诉协议）指公司承认事实但暂不被起诉的和解机制；NPA（不起诉协议）指更轻的形式，不涉及起诉后再和解；plea agreement（认罪协议）指被告同意认罪以换取减刑或其他利益。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  - id: D02-007
    location: "从暂缓起诉到不起诉 / "the procedural shell, having cracked on its own terms in 2024, re-formed in 2025 and was sustained on appeal in 2026""
    type: prose-choice
    decision: "译为「程序外壳，在2024年按其自身条件破裂后，于2025年重新形成，并于2026年在上诉中得到维持」"
    alternatives_considered:
      - "程序外壳在2024年破裂，2025年重新形成……"（丢失了"on its own terms"的含义）
    rationale: "这是全章最关键的不可逆性分析句。"cracked on its own terms"暗示程序外壳的破裂不是来自外部挑战，而是按自身条件（如法律条款）破裂，然后重新形成。中文"按其自身条件"保留此含义。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  - id: D02-008
    location: "全章 / "it can also recurse inside any one floor of the stack""
    type: prose-choice
    decision: "译为「它也可以在阶梯的任意一层内部递归」"
    alternatives_considered:
      - "在任意一层内部循环（"循环"丢失了计算机科学中'recursion'的精确含义：同一操作在同一层面以不同形式反复出现）
      - "自我复制"（过于生物学化）
    rationale: ""递归"（recursion）是计算机科学术语，指一个过程在其自身定义内调用自身。此处原文确实使用了计算隐喻，中文"递归"保留了这一精确含义。对非技术读者可能短暂陌生，但上下文提供了足够的理解线索。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: glossary-master
    review_outcome: pass
    glossary_ruling: "Glossary Master 裁决 2026-06-12 — 批准「递归」。上下文中的'层级阶梯'(stack)隐喻已为此铺垫。已在 glossary.yml 新增 recursion 条目，forbidden: [「循环」,「重复」,「自我复制」]。译者首次出现时在翻译笔记中说明隐喻用法即可，正文不需要括号注英文。"

  # === 方法论术语 ===

  - id: D02-009
    location: "弗朗西斯·拉塞尔的论证 / "counter-reading""
    type: term-choice
    decision: "译为「反读」"
    alternatives_considered:
      - "对立解读"（丢失了"counter-"的对抗性——这是对同一案例的相反解读）
      - "反方解读"（冗长）
    rationale: ""counter-reading"在本章是方法论术语，指对同一案例的相反解读，源自不同的证据评估。"反读"简洁且保留了对抗性前缀"反-"。术语在跨章节使用时需保持一致性。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  - id: D02-010
    location: "全章 / "the cost of escape""
    type: term-choice
    decision: "译为「逃脱的代价」"
    alternatives_considered:
      - "逃脱的代价（保留）——首次决策后确认：这是正确的选择。'逃脱'（escape）是全书beat 9的核心术语（配对counter-case）。"逃脱"暗示一种从洗白结构中脱离的可能性，但代价沉重。"
    rationale: "全章分析性概念——每次对洗白模式的拦截都有代价，且代价往往不成比例地高昂。译者标注[TERM-NOTE]说明其方法论含义。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  - id: D02-011
    location: "全章 / "record-hardening""
    type: term-choice
    decision: "译为「记录固化」"
    alternatives_considered:
      - "记录硬化"（过于字面）
      - "档案固化"（"记录"更精确—records不是仅指档案，而是指所有形式的记录/叙事）
    rationale: ""record-hardening"指记录（包括法律记录、调查结果、官方叙事）随着时间推移和制度环境变化而变得难以改变或重新审查的过程，尤其是在保密环境下。中文"固化"保留了从"柔软/可改变"到"坚硬/不可改变"的转变隐喻。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  - id: D02-012
    location: "全章 / "the seam" (接缝比喻)"
    type: prose-choice
    decision: "译为「接缝」"
    alternatives_considered:
      - "裂缝"
      - "交界处"
    rationale: ""seam"是本书的重要比喻——指洗白结构中某个深层结构暴露出来的位置。"接缝"保留了原文的比喻：当衣服在某处接缝裂开时，内部结构可见。在"我们就是谴责即将落下的接缝"中，这个比喻尤为关键。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  - id: D02-013
    location: "全章 / "bright lines""
    type: term-choice
    decision: "译为「亮线」"
    alternatives_considered:
      - "明确边界"（丢失了法律术语"亮线规则"的精确性）
      - "红线"（中文政治语境中的常见隐喻，但原文是"bright line"而非"red line"）
    rationale: ""bright line"（亮线）是美国法律术语，指清晰、明确、无需主观判断的规则边界。中文法律文献中已有"亮线规则"这一借译。在本书中，国际人道法条款就是这种"亮线"——洗白手法试图模糊这些明确的边界。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
    review_outcome: pending

  # === 国际人道法 / 法律文书术语 ===

