    decision: "严格按照联合国/红十字国际委员会官方中文译本翻译日内瓦公约条款"
    rationale: "日内瓦公约等国际人道法文书有联合国和ICRC发布的官方中文文本。翻译时必须使用官方文本的约定译法，而非自行翻译。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: 待审核
