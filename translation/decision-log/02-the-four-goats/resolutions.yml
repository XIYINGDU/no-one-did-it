  - id: "HARD-01-doctrine"
    source_review: "02-the-four-goats-review-1"
    source_finding: "系统性术语选择错误——'doctrine/doctrinal'（中性制度术语）被译为「教条」（dogma的贬义），全章至少10处，将分析冷度变为道德谴责"
    severity: HARD
    found_by: reviewer
    found_at: "准确性 HARD #1 / 语域 HARD #1"
    assigned_to: translator
    status: fixed
    fix_description: >
      全章12处「教条」逐语境修复：
      - 军事/指挥链语境（5处）→ 「条令」：军事教条机器→军事条令机器；
        指挥链、教条、政策的层面→指挥链、条令、政策的层面；
        教条上的模糊性→条令上的模糊性；教条层面→条令层面；
        制造了教条→制定了条令。
      - 法律/原则/制度语境（7处）→ 「原则」：现有教条→现有原则；
        教条框架→原则框架；可用教条→可用原则；教条能/不能到达→原则能/不能到达；
        将教条延伸到→将原则延伸到。
      同时更新 glossary.yml，新增 doctrine/doctrinal 条目，forbidden: [「教条」]。
    fixed_at: "2026-06-12"
    verified_by: reviewer
    verified_at: "2026-06-12"
    override_by: ""
    override_reason: ""

