    assigned_to: translator
    status: fixed
    fix_description: "「公司作为一个充分性容器」→「公司作为法律意义上的'充分性容器'」。增加「法律意义上的」极简语境引导，帮助读者建立概念图式（该术语是法律分析框架中的特定概念，而非日常概念）。未改变 glossary 锁定译法「充分性容器」。英文对照（sufficiency container）保留括号注。"
