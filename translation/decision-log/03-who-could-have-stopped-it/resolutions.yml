  - id: "CR-HARD-4-slash-taxonomy"
    source_review: "chinese-reader-cold-read-03"
    source_finding: "「系统/对象托辞」——斜线读起来像技术代码，在中文正文中不自然"
    severity: HARD
    found_by: chinese-reader
    found_at: "可读性 HARD — 斜线术语"
    assigned_to: translator
    status: fixed
    fix_description: "首次出现展开为「系统托辞或对象托辞」：四分类枚举句从「纯粹替罪羊、部分替罪羊、系统/对象托辞和承担代价的山羊」改为「纯粹替罪羊、部分替罪羊、系统托辞或对象托辞，以及承担代价的山羊」。同时「和」改为「以及」以与非并列的「或」区分。「或」表明该分类涵盖两种子形态（系统作为托辞或对象作为托辞）。同一段中的第二次出现「是一个系统/对象托辞」保留斜线简写形式。未改变 glossary 锁定译法。"
