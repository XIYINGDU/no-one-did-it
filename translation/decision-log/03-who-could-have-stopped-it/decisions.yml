  - id: D03-006
    location: "第 2 段 — defeat device"
    type: term-choice
    decision: "译为「作弊装置（defeat device）」——首次出现时括号注英文"
    alternatives_considered: ["译为「失效装置」", "直接译为「作弊装置」"]
    rationale: "defeat device 在美国排放法规中的技术含义是'使排放控制装置失效的装置'。但在本书的公共叙事语境中，其含义更接近'作弊/欺骗装置'。综合考虑，译为「作弊装置」比「失效装置」更准确地传达了该装置的功能性质。首次出现时保留英文对照以确保术语精确性。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending

  - id: D03-007
    location: "第 8 段 — Jones Day"
    type: term-choice
    decision: "保留 Jones Day 英文原名"
    alternatives_considered: ["译为「琼斯·戴律师事务所」"]
    rationale: "Jones Day（众达）是国际知名律所，在中国法律界已有约定俗称的中文名「众达」。但考虑到英文原文使用 Jones Day 且本书读者可能不认识「众达」，保留原文更为稳妥。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending

  - id: D03-008
    location: "第 8 段 — rogue engineers"
    type: term-choice
    decision: "译为「流氓工程师」——保留原文的贬义情绪强度"
    alternatives_considered: ["不服从管理的工程师", "违规操作的工程师"]
    rationale: "原文 rogue engineers 在大众公司的叙事中有明确的贬义——将工程师描绘为偏离组织控制的'脱缰者'。中文「流氓」在此语境中不是指性犯罪，而是指不守规矩/不受控制的人。保留此译法以传达原文叙事中的情绪强度。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending

  - id: D03-009
    location: "第 5 段（Pinto 段落）— the striking driver"
    type: term-choice
    decision: "译为「撞击方驾驶员」"
    alternatives_considered: ["后车驾驶员", "追尾驾驶员"]
    rationale: "原文「the striking driver」指追尾的驾驶员（striking = delivering a blow/strike）。在 Pin to 案件中，这是福特诉讼策略框架下将责任转移给后车驾驶员的手法。译为「撞击方驾驶员」比「后车驾驶员」更能传达其法律归责含义。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending

