  - id: D03-005
    location: "第 2 段 — Clean Air Act"
    type: term-choice
    decision: "译为「《清洁空气法》」"
    alternatives_considered: ["《清洁空气法案》"]
    rationale: "美国 Clean Air Act 是联邦成文法，中文环境法和美国法文献中约定译法为《清洁空气法》。Act 译为法而非法案（bill是法案，act是已生效的法律）。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
