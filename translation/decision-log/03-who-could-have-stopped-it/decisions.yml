  - id: D03-024
    location: "第 10 条 — Indictment"
    type: term-choice
    decision: "译为「大陪审团起诉书」"
    alternatives_considered: ["起诉书", "公诉书"]
    rationale: "indictment 在美国联邦刑事程序中是指大陪审团（grand jury）批准后的正式重罪起诉书。与 information（检察官直接起诉）不同。此处 Martin Winterkorn 等人是 grand jury indictment，故译为「大陪审团起诉书」以准确反映其法律程序性质。后续再次出现时可简化为「起诉书」。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending

  - id: D03-025
    location: "第 12 条（福特的段落）— The company absorbed the civil punitive damages"
    type: prose-choice
    decision: "absorbed 译为「消化」——保留原文的"吸收/消化"隐喻"
    alternatives_considered: ["承担", "吸收了"]
    rationale: "原文 absorb 在此语境下有两层含义：一是福特公司'吸收了'惩罚性赔偿（承受了财务打击），二是公司作为一个容器'吸收'了法律后果，使其不向上传递到个人。译为「消化」保留了这个双层含义的潜在可能。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending

  - id: D03-026
    location: "第 11 条 — working accountability"
    type: prose-choice
    decision: "译为「运转中的问责」"
    alternatives_considered: ["有效的问责", "运作的问责"]
    rationale: "原文 objection 声称：Volkswagen Dieselgate 的罚款和定罪是'working accountability'——问责制在运转。译为「运转中的问责」保留了 working 作为动词的分词含义（正在工作/运转）。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending

  - id: D03-027
    location: "第 11 条 — partial interception 和 clean interception"
    type: term-choice
    decision: "interception 译为「拦截」（与第 1 章一致）；clean interception 译为「干净的拦截」"
    alternatives_considered: []
    rationale: "interception 在本书中不是法律/情报意义上的拦截，而是指制度性机制在洗白模式运行过程中将其截断。第 1 章已建立此译法。本章的「clean interception」添加了「干净的」以强调拦截的完整性和正当性。"
    decided_by: translator
    decided_at: 2026-06-12
    reviewed_by: null
    review_outcome: pending
