    rationale: "按全书翻译规范——非英语文字保留原文斜体，首次出现时括号注中文翻译。此处的引文是一句完整的拉丁文拉丁文格言，虽正文已有英译，但保留拉丁文原文有助于读者感受古典引用的质感。"
