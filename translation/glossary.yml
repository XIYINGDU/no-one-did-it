# 翻译术语表 — 所有译者的共享真相源
#
# 规则：
# 1. 术语表一旦锁定，Translator 只有使用权没有修改权
# 2. 任何术语修改必须经过 Glossary Master
# 3. forbidden 字段列出禁止使用的替代译法
# 4. 每个术语标注 first_chapter（首次出现的章节）和 domain（所属领域）
#
# 全书翻译策略（Glossary Master 裁决 2026-06-10）：
#
# 词源讨论段落的外文词汇策略（原文：ch-01 廷代尔段落 scapegoate 词源分析）：
# 当原文讨论英语（或其他语言）的词源/构词时，该外文词汇本身即是讨论的对象，
# 不可翻译。全书统一处理如下：
# 1. 被讨论的词源性外文词汇以斜体保留原文形式（如 scapegoate, escape-goat）
# 2. 正文中的中文叙事提供足够的上下文，使不读该外文的读者能理解论证线索
#    例：ch-01 中解释"他将 Azazel 解读为一个合成词：ez ozel，离开的山羊，
#    the escape-goat。在他 1530 年的英语摩西五经中，他写下了 scapegoate。"
#    即使不读英文的读者也能从中文上下文中理解词源过程
# 3. 首次出现的词源性关键外文词汇，在翻译笔记（非正文）中给出详细解释
# 4. 不在正文段落内加括号注中文——词源讨论的认知焦点应保持在论证本身，
#    而非为读者逐词翻译被讨论的词汇

terms:

  # === 核心概念（全书基石） ===

  - en: "scapegoat"
    zh: "替罪羊"
    forbidden: ["替罪羔羊", "代罪羔羊", "赎罪羊"]
    domain: "核心概念"
    first_chapter: 1
    note: "全书最核心的术语。源自 Tyndale 1530 年英译圣经时创造的 scapegoate 一词（escape-goat 的合成）。中文'替罪羊'已是约定译法，全书统一使用。"

  - en: "scapegoating"
    zh: "替罪"
    forbidden: ["找替罪羊", "归罪"]
    domain: "核心概念"
    first_chapter: 1
    note: "作为动词/过程使用时的译法。'替罪机制'在需要强调系统性的语境下也允许。"

  - en: "responsibility laundering"
    zh: "责任洗白"
    forbidden: ["责任漂洗", "责任转移", "责任推卸", "责任清洗"]
    domain: "核心概念"
    first_chapter: 1
    note: "全书的核心论点术语。'洗白'保留了 laundering 的隐喻（将脏钱洗白的过程类比），且中文'洗白'有较明确的负面含义。"

  - en: "pure scapegoat"
    zh: "纯粹替罪羊"
    forbidden: ["完全替罪羊", "无辜替罪羊"]
    domain: "分类术语"
    first_chapter: 2
    note: "四种分类之一。'纯粹'强调其无辜性——被归咎者基本无辜。"

  - en: "partial scapegoat"
    zh: "部分替罪羊"
    forbidden: ["不完全替罪羊", "半替罪"]
    domain: "分类术语"
    first_chapter: 2
    note: "四种分类之一。被归咎者确有参与或有过失，但归责停在过低层级。"

  - en: "system/object alibi"
    zh: "系统/对象托辞"
    forbidden: ["系统替罪", "机器托辞", "制度托辞"]
    domain: "分类术语"
    first_chapter: 2
    note: "四种分类之一。机器、算法、公司、委员会、市场、法律程序成为被命名的原因。"

  - en: "cost-bearing goat"
    zh: "承担代价的山羊"
    forbidden: ["代价承担者", "受害替罪羊"]
    domain: "分类术语"
    first_chapter: 2
    note: "四种分类之一。受害者或底层工作者未被指责为有罪，但在责任被逃避的同时承受了伤害。"

  # === 第 1 章专属术语 ===

  - en: "substitution"
    zh: "替代"
    forbidden: ["替换", "代替"]
    domain: "仪式/机制"
    first_chapter: 1
    note: "本章核心机制术语。指用可见的替罪羊替代不可见的责任链。不同于一般意义的'replacement'。"

  - en: "the altar"
    zh: "祭坛"
    forbidden: ["神坛", "圣坛"]
    domain: "仪式/隐喻"
    first_chapter: 1
    note: "全书题目的核心隐喻。'祭坛移动了，替代没有消失'——仪式的外在形式现代化了，但替代机制本身不变。"

  - en: "pharmakos"
    zh: "pharmakos（替罪人）"
    forbidden: []
    domain: "古代仪式"
    first_chapter: 1
    note: "古希腊仪式中被驱逐出城的替罪者。首次出现时保留希腊文转写并括号注中文。后续出现可用'pharmakos'。"

  - en: "Azazel"
    zh: "阿撒泻勒"
    forbidden: []
    domain: "圣经/古代"
    first_chapter: 1
    note: "利未记中替罪羊被送往的目的地。学术界对其是地名还是恶魔名存在争议。中文圣经传统译法。"

  - en: "council communist"
    zh: "委员会共产主义者"
    forbidden: ["苏维埃共产主义者", "议会共产主义者"]
    domain: "政治/历史"
    first_chapter: 1
    note: "1920-30 年代荷兰/德国左翼共产主义流派成员。反对列宁主义先锋党模式，主张工人委员会(Räte)直接民主。中文政治学术语'委员会共产主义'的派生用法。首次出现时翻译笔记中已提供解释。"
    ruling: "Glossary Master 裁决 2026-06-10 — 译法准确。Chinese Reader SOFT 发现'有短暂停顿'属于准确术语的可接受认知成本。"

  - en: "alibi"
    zh: "托辞"
    forbidden: ["不在场证明", "借口", "说辞"]
    domain: "核心概念"
    first_chapter: 1
    note: "本书中的 alibi 不是法律意义上的'不在场证明'，而是指为真正的责任承担者提供掩护的叙事/程序/制度。'托辞'保留了'有意的掩护'的含义。"

  - en: "hidden architecture"
    zh: "隐藏架构"
    forbidden: ["隐藏结构", "暗藏结构", "底层架构"]
    domain: "分析方法"
    first_chapter: 1
    note: "本书的核心分析方法术语。指在'官方叙事'之下支撑责任洗白的制度、法律和程序架构。"

  - en: "responsibility chain"
    zh: "责任链"
    forbidden: ["责任链条"]
    domain: "分析方法"
    first_chapter: 1
    note: "从可见的被归咎者向上追溯的控制链/受益链/知情链。区别于供应链(supply chain)或指挥链(chain of command)。"

  # === 法律/政治术语 ===

  - en: "Reichstag Fire Decree"
    zh: "国会纵火法令"
    forbidden: ["国会大厦纵火法令"]
    domain: "历史/德国"
    first_chapter: 1
    note: "1933年2月28日兴登堡签署的《保护人民和国家的总统令》。中文史学界通用'国会纵火法令'。"

  - en: "Enabling Act"
    zh: "授权法"
    forbidden: ["授权法案", "赋能法"]
    domain: "历史/德国"
    first_chapter: 1
    note: "1933年3月23日通过的《消除人民和国家痛苦法》(Gesetz zur Behebung der Not von Volk und Reich)。中文史学界通用'授权法'。"

  - en: "Lex van der Lubbe"
    zh: "范·德·卢贝法"
    forbidden: []
    domain: "历史/德国"
    first_chapter: 1
    note: "1933年3月29日通过的追溯性死刑修正案，专为处决 van der Lubbe 而设。"

  - en: "NS-AufhG"
    zh: "《纳粹不公正判决撤销法》"
    forbidden: []
    domain: "法律/德国"
    first_chapter: 1
    note: "1998年德国联邦议院通过的《撤销国家社会主义刑事司法不公正判决法》。首次出现时给出德文全称和中文翻译，后续可用 NS-AufhG。"

  # === 人名 ===

  - en: "Marinus van der Lubbe"
    zh: "马里努斯·范·德·卢贝"
    forbidden: []
    domain: "人名"
    first_chapter: 1
    note: "荷兰人名。遵循新华社译名规范。"

  # === 书名/文献名 ===

  - en: "Anchor Bible"
    zh: "锚圣经（Anchor Bible）"
    forbidden: []
    domain: "学术/圣经研究"
    first_chapter: 1
    note: "Doubleday/Yale 出版的知名学术圣经注释系列。中文圣经学界无单一约定译法，采用中英对照形式以保留系列名称的可识别性。Anchor Bible Dictionary 按同一模式处理。"
    ruling: "Glossary Master 裁决 2026-06-10 — 中英对照格式已满足可识别性和可读性双重需求。"

  - en: "Anchor Bible Dictionary"
    zh: "锚圣经词典（Anchor Bible Dictionary）"
    forbidden: []
    domain: "学术/圣经研究"
    first_chapter: 1
    note: "Anchor Bible 系列的多卷本圣经词典。译法跟随 Anchor Bible。"
    ruling: "Glossary Master 裁决 2026-06-10 — 跟随 Anchor Bible 译法。"

  - en: "The Laws of Manu"
    zh: "《摩奴法典》"
    forbidden: []
    domain: "文献"
    first_chapter: 1

  - en: "Leviticus"
    zh: "《利未记》"
    forbidden: []
    domain: "圣经"
    first_chapter: 1
    note: "圣经旧约第三卷。中文和合本译法。"

  # === 一般术语 ===

  - en: "cost"
    zh: "代价"
    forbidden: ["成本"]
    domain: "一般"
    first_chapter: 1
    note: "在本书的伦理/政治语境下，cost 译为'代价'而非'成本'。'成本'偏向经济学含义。"

  - en: "bearing"
    zh: "承担"
    forbidden: ["背负", "承受"]
    domain: "一般"
    first_chapter: 1
    note: "在 cost-bearing goat 等表达中统一使用'承担'。"

  # === 第 2 章修复增加 ===

  - en: "doctrine"
    zh: "条令 / 原则"
    forbidden: ["教条", "教条主义"]
    domain: "法律/军事"
    first_chapter: 2
    note: "中性的制度性术语，非 dogmatic。在军事/指挥链语境下译为「条令」；在法律/国际法语境下译为「原则」。禁止使用「教条」。具体语境映射见翻译笔记层。"

  - en: "doctrinal"
    zh: "条令的 / 原则的"
    forbidden: ["教条的"]
    domain: "法律/军事"
    first_chapter: 2
    note: "doctrine 的形容词形式。语境译法随 doctrine。'doctrinal ambiguity' → 条令模糊性（军事）；'doctrinal frame' → 原则框架（法律）。"

  # === 第 2 章新增术语（Glossary Master 裁决 2026-06-12） ===

  - en: "meat eaters"
    zh: "主动索贿者"
    forbidden: ["肉食者"]
    domain: "犯罪学/警务"
    first_chapter: 2
    note: "纳普委员会（Knapp Commission）对纽约警察腐败的分类术语。'主动索贿者'(meat eaters)指主动寻找腐败机会的警察；'被动受贿者'(grass eaters)指被动接受贿赂而非主动索要的警察。英文比喻在中文中不可保留，故采用功能意译。首次出现时保留英文括号对照。"
    ruling: "Glossary Master 裁决 2026-06-12 — 功能意译准确。'肉食者'禁止——该词在古汉语中有独立含义，会造成混淆。要求首次出现时中英对照。"
    translation_strategy: "source-metaphor-unrecoverable"

  - en: "grass eaters"
    zh: "被动受贿者"
    forbidden: ["草食者"]
    domain: "犯罪学/警务"
    first_chapter: 2
    note: "纳普委员会（Knapp Commission）对纽约警察腐败的分类术语。见 meat eaters 条目。首次出现时保留英文括号对照。"
    ruling: "Glossary Master 裁决 2026-06-12 — 跟随 meat eaters 裁决。"
    translation_strategy: "source-metaphor-unrecoverable"

  - en: "pad system"
    zh: "保护费制度"
    forbidden: ["贿赂制度", "保护金制度", "份子钱制度"]
    domain: "犯罪学/警务"
    first_chapter: 2
    note: "纳普委员会（Knapp Commission）描述的纽约市警局系统性勒索制度。pad 指警察每月从非法商户收取的固定'份额'(share)。中文'保护费制度'的'黑社会收保护费'联想在此处与原文所指的保护费勒索(protection racket)高度吻合，并非误导。该术语在中文语境中尚无预设参考文献，当前译法基于上下文意译。"
    ruling: "Glossary Master 裁决 2026-06-12 — 译法准确。'保护费'的犯罪组织联想在此恰好服务于原意的准确传达。禁止使用弱化该制度本质的替代词。无需首次出现中英对照。"
    translation_strategy: "functional-equivalent"

  - en: "recursion"
    zh: "递归"
    forbidden: ["循环", "重复", "自我复制"]
    domain: "计算机科学隐喻"
    first_chapter: 2
    note: "原书在分析性语境中使用计算机科学隐喻——托辞(recurse/alibi)可以在制度层级阶梯的任意一层'递归'(以自相似结构反复出现)。'递归'在中文中的首要含义是CS术语，但在本书中作为跨学科隐喻使用，上下文（'制度的层级阶梯'）已提供足够的理解线索。译者应在首次出现的翻译笔记中说明此隐喻用法，正文不需要括号注英文。后续章节如再次出现同一隐喻，需保持同一译法。"
    ruling: "Glossary Master 裁决 2026-06-12 — 批准。上下文中的'层级阶梯'(stack)隐喻已为此铺垫。禁止使用'循环'或'重复'——两者丢失了递归的'自相似结构在不同层级重复'的精确含义。"

  # === 第 4 章新增术语（Glossary Master 裁决 2026-06-13） ===

  - en: "proxy"
    zh: "代理人"
    forbidden: ["代理", "代表", "傀儡"]
    domain: "核心概念"
    first_chapter: 4
    note: "本章核心概念之一。proxy 指被置于可见位置的行动者，其真实身份被刻意抹除，而真正的控制者（sponsor/出资人）隐藏在其后。不同于一般意义的'代表'(representative)或'代理'(agency)，强调可见行动者的可替代性和可否认性。'代理人'与'出资人'形成配对术语。"
    ruling: "Glossary Master 裁决 2026-06-13 — 批准。'代理人'与'出资人'的配对经得起跨案例检验。禁止使用'傀儡'——该词过于贬义且暗示完全无自主性，而原文的 proxy 可能具有真实的操作能力，只是归责链被刻意截断。"

  - en: "sponsor"
    zh: "出资人"
    forbidden: ["赞助者", "赞助商", "发起人", "主使人"]
    domain: "核心概念"
    first_chapter: 4
    note: "与 proxy 配对的核心概念。'出资人'强调该实体提供了手段（武器、合同、资金）并控制行为地域，但不以自己名义行事。'出资'在中文中的商业/金融含义在此语境下服务于传达'提供资源但隐身幕后'的关系。"
    ruling: "Glossary Master 裁决 2026-06-13 — 批准。'赞助商'禁止——其营销/慈善联想会削弱该术语的制度性严肃含义。'主使人'禁止——过度暗示直接下令，原文的 sponsor 可能不直接下令，而是通过提供手段和地域间接控制。"

  - en: "plausible deniability"
    zh: "可否认性"
    forbidden: ["合理否认", "貌似可信的否认", "可信推诿"]
    domain: "政治/军事"
    first_chapter: 4
    note: "标准国际关系术语。指通过刻意设计使上级机构或个人能够'可信地否认'对某行为的知情或授权。'可否认性'是中文国际关系/外交学界的约定译法。首次出现时括号附英文。"
    ruling: "Glossary Master 裁决 2026-06-13 — 批准。标准译法。首次出现时中英对照以保证读者理解该术语的精确含义。"

  - en: "procedural shell"
    zh: "程序外壳"
    forbidden: ["程序外衣", "程序壳", "程序掩体"]
    domain: "核心概念"
    first_chapter: 4
    note: "本章分析框架的核心机制术语。指法律/程序/制度性的分类外壳（如'承包商'分类、'非国家武装团体'分类），设计目的是吸收归责，使归责链在到达出资人之前终止。'外壳'在中文中有'表面看起来是...实际上...'的联想。"
    ruling: "Glossary Master 裁决 2026-06-13 — 批准。'程序外壳'保留了原文 shell 的'容器/空壳'双重含义。禁止'程序掩体'——'掩体'(bunker)在中文中的军事防御联想会误导读者。"

  - en: "record-hardening"
    zh: "记录固化"
    forbidden: ["记录硬化", "记录强化"]
    domain: "分析方法"
    first_chapter: 4
    note: "指将事件固定在制度性记录中——法庭判决、联合国决议、调查报告等——使其事实状态不易被撤销或篡改的过程。动词形式'to harden the record'译为'固化记录'。'固化'在中文中有'从液态变为固态→不可逆转'的隐喻，与原文的金属/材料隐喻(harden)恰相对应。"
    ruling: "Glossary Master 裁决 2026-06-13 — 批准。'固化'合理——保留了原文的物态变化隐喻，且中文读者可自然理解。'硬化'禁止——在中文医学语境中已有独立含义（动脉硬化等），会造成混淆。"

  - en: "territory of the act"
    zh: "行为地域"
    forbidden: ["行为领地", "行为领土", "行动区域"]
    domain: "法律/国际法"
    first_chapter: 4
    note: "指出资人控制的行为发生地域。在克里米亚案例中指俄军控制的半岛，在 MH17 案例中指顿涅茨克发射区域，在黑水案例中指巴格达尼苏尔广场。'地域'比'领土'更中性——不暗示主权主张。"
    ruling: "Glossary Master 裁决 2026-06-13 — 批准。'行为领土'禁止——'领土'在国际法中具有主权含义，而原文的 territory of the act 是分析性框架术语，不是主权主张。"

  - en: "interception"
    zh: "拦截"
    forbidden: ["截断", "阻止", "截获"]
    domain: "分析方法"
    first_chapter: 4
