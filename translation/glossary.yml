    note: "本章核心分析结论术语——借口（pretext）之所以需要机制多样性，是因为单一制度渠道（法院/国会/监察长/GAO）的管辖范围和穿透力各不相同，没有一个渠道能穿透所有三种场景的借口。'渠道多样性'禁止——本章的'渠道'已用于 piercing channel（穿透渠道），需避免与渠道概念的混淆。"

