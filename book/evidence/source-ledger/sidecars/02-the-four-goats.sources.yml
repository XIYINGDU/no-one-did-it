# Built 2026-05-26 by stephen-fact-check-director after Wave D's
# CITE-anchor backfill on the ch-02 prose. Wave D inserted the
# anchors and constructed the 56 cards now listing 02-the-four-goats
# in chapters_citing; this sidecar resolves each in-prose anchor to
# its backing card(s).
#
# Chapter 2 ("The Four Goats") installs the four-category taxonomy
# across nine cases: 4 anchors (Therac-25, 737 MAX, Abu Ghraib,
# Ukrainian-children transfers), 1 within-case counter-reading
# (Russell on Sacco), and 4 paired interceptions (Dreyfus, Knapp,
# Horizon, Stolen Generations). The ICRC report, Karpinski order,
# and OPR/Margolis memorandum appear as the same-paragraph
# institutional context for Abu Ghraib.
#
# Validator note: the [CITE:] regex captures up to the first ']';
# the substring-match logic in cross_reference_integrity accepts
# either direction between the captured anchor_text and the
# strings below.

# Refreshed by scripts/refresh_sidecar_anchors.py — anchor_text now
# carries the card slug (matching the rule-13 [CITE: <slug>] form in
# chapter prose). The original human-readable citation moved to the
# `description` field on each anchor. PyYAML round-trip preserves the
# leading comment block above but may have dropped any mid-file inline
# comments; recover from git history if needed.

