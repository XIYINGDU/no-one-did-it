# Book-level callback graph.
#
# Schema source: .claude/skills/callback-audit/SKILL.md
# Audited by: /callback-audit (per chapter rewrite), /dependency-check (cross-chapter)
#
# Each edge records one setup → payoff pair. The plant in one chapter sets up
# the payoff in another. Callback-audit verifies both endpoints exist in their
# named chapters whenever any chapter in the graph is rewritten.
#
# Edge types:
#   - object_callback : same artifact recurs (manila folder → same manila folder)
#   - phrase_callback : load-bearing word or image recurs
#   - scene_callback  : structurally mirrored scene
#   - rule_callback   : rule stated in one chapter applied/violated in another
#
# Payoff kinds:
#   - re-reading    : the planted thing is seen differently the second time
#   - reversal      : the planted thing's apparent meaning is overturned
#   - confirmation  : the planted thing's apparent meaning is confirmed
#   - refutation    : the planted thing's apparent meaning is shown false
#   - ambient       : atmospheric repetition; not audited
#
# `required: true` causes hard fail on missing payoff. `required: false` is soft flag.
#
# Section field convention: literal v6 H2 heading where the line_anchor resolves.
# "Chapter opening" denotes content before the first H2. Reconciled to v6 canonical
# on 2026-05-30 (see process/audits/chekhov-verification-2026-05-30.md); pre-2026-05-30
# section names used conventional A2B beat names ("accusation scene", "older echo")
# that no longer match v6's descriptive section headings.

