retirements:
  # The pre-book frame that "if a case is complicated, it must be
  # un-blameable" — retired by ch-5's demonstration that involved-but-not-
  # sole actors absorb attribution precisely because they are partially
  # culpable. The visible-consequence test is replaced by the chain test.
  - {id: "pre-book-frame:complexity-equals-innocence",              retired_by: 5}

  # The pre-book frame that "if the named actor is sympathetic / a victim
  # / weak, they cannot be the responsibility-holder". Retired by ch-2's
  # cost-bearing-goat install (the harm-bearer's weakness is the
  # laundering's surface, not its discharge) and by ch-3's diagnostic that
  # separates moral weight from chain position.
  - {id: pre-book-frame:weakness-equals-innocence,                  retired_by: 2}

  # The pre-book frame that "if the named cause is a system, machine,
  # process, or institution, no human is responsible". Retired by ch-2's
  # system/object-alibi install (Therac-25 / Boeing) and consolidated by
  # ch-7 (Horizon's five-role conflation makes the human chain inside the
  # system visible).
  - {id: pre-book-frame:system-is-not-an-agent,                     retired_by: 2}

  # The pre-book frame that "the bad-apples explanation closes the case".
  # Retired by ch-2's Abu Ghraib install (chain stopped at staff sergeant)
  # plus the Knapp Commission counter (the move is structurally identifiable
  # as the partial-scapegoat shape; bad-apples is the rhetorical form).
  - {id: pre-book-frame:bad-apples-closes-the-case,                 retired_by: 2}

  # The pre-book frame that "intelligence was wrong" exhausts strategic
  # responsibility — i.e., that the institutional-product framing is the
  # full account when the product fails publicly. Retired by ch-10 (Iraq
  # WMD: SSCI Phase II, DoD IG OSP, Chilcot all establish a public-
  # statements gap distinct from the underlying product's hedges).
  - {id: pre-book-frame:intelligence-was-wrong-equals-policy-not-responsible, retired_by: 10}

  # The pre-book frame that "the accountability mechanism is itself an
  # overreach" when invoked against the speaker's preferred actor. Retired
  # by ch-8's structural test (the diagnostic is administration-agnostic;
  # Watergate 1974 and Iran-Contra 1992 show the same inversion across
  # parties).
  - {id: pre-book-frame:accountability-mechanism-equals-overreach,  retired_by: 8}

