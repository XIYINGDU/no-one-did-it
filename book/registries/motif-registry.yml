# Book-level motif registry.
#
# Schema source: .claude/skills/motif-audit/SKILL.md
# Audited by: /motif-audit (per chapter rewrite), /dependency-check
#
# A motif is a CONCRETE recurring image — an object, a phrase, a setting —
# threaded through multiple chapters. Distinct from:
#   - metaphor field (one per book, declared via /device-audit)
#   - analogy cards (single-chapter devices)
#   - mirror artifacts (chapter-internal device, also tracked by /device-audit)
#
# Fields:
#   id                       : kebab-case identifier
#   field                    : which master metaphor field the motif lives in
#   literal_or_metaphorical  : literal | metaphorical | both
#   appearances              : list of {chapter, treatment, role}
#   evolution                : 3+ stage progression string
#   forbidden_in             : chapters where the motif must NOT appear
#   frequency_floor          : minimum verified appearances (motif demotes if below)

motifs:

  - id: the-chain
    field: evidence-forensics
    literal_or_metaphorical: metaphorical
    appearances:
      - {chapter: 2,  treatment: metaphorical, role: scene-anchor}
      - {chapter: 3,  treatment: metaphorical, role: scene-anchor}
      - {chapter: 4,  treatment: metaphorical, role: callback}
      - {chapter: 5,  treatment: metaphorical, role: scene-anchor}
      - {chapter: 6,  treatment: metaphorical, role: callback}
      - {chapter: 7,  treatment: metaphorical, role: callback}
      - {chapter: 10,  treatment: metaphorical, role: callback}
      - {chapter: 8,  treatment: metaphorical, role: callback}
      - {chapter: 9, treatment: metaphorical, role: callback}
      - {chapter: 11, treatment: metaphorical, role: callback}
      - {chapter: 12, treatment: metaphorical, role: resonant-return}
      - {chapter: 13, treatment: metaphorical, role: resonant-return}
    evolution: "chain stops at visible actor (ch-2) → chain climbs by diagnostic (ch-3) → chain runs upward by design rule (ch-11) → chain becomes the reader's instrument (ch-13)"
    forbidden_in: [1]
    frequency_floor: 8

  - id: the-named-cause
    field: evidence-forensics
    literal_or_metaphorical: both
    appearances:
      - {chapter: 1,  treatment: literal,      role: callback}
      - {chapter: 2,  treatment: literal,      role: scene-anchor}
      - {chapter: 3,  treatment: literal,      role: scene-anchor}
      - {chapter: 4,  treatment: literal,      role: scene-anchor}
      - {chapter: 5,  treatment: literal,      role: callback}
      - {chapter: 6,  treatment: literal,      role: scene-anchor}
      - {chapter: 10,  treatment: metaphorical, role: callback}
      - {chapter: 8,  treatment: literal,      role: callback}
      - {chapter: 9, treatment: metaphorical, role: resonant-return}
      - {chapter: 13, treatment: metaphorical, role: resonant-return}
    evolution: "the named cause is a person (ch-2 pure scapegoat) → the named cause is a thing (ch-2/4/7 system alibi) → the verb's subject is a thing (ch-9 AI grammar) → the named cause is the laundering's location (ch-13 diagnostic close)"
    forbidden_in: []
    frequency_floor: 6

