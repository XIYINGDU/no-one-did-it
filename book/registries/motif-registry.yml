    evolution: "historical signing acts establish the artefact (ch-1 Hindenburg, ch-2 ODA self-signing) → signature names a person (ch-3 diagnostic) → signature is the laundering's terminal point (ch-6/7) → signature is the design's accountability seam (ch-11) → refusal to sign is the reader's primary move (ch-13)"
    forbidden_in: []
    frequency_floor: 5

