# Per-chapter treatment class declarations.
#
# Schema source: .claude/rules/08-treatment-class-discipline.md
# Used by: /chapter-defect-diagnose (writes rows), /contract-audit, /dependency-check,
#          pre-edit-chapter-snapshot.py, post-edit-status-check.py
#
# Each row declares ONE chapter's treatment class for the current rewrite cycle.
# Classes (from rule 08):
#   no-change                  : passes all rule-12 values; no work needed
#   prose-polish               : sentence-level only; no structural change
#   defamation-safe-tighten    : rule-05 / rule-07 surface flagged by Nancy
#   structural-polish          : scene reorder, focalizer adjustment, motif insertion
#   full-craft-rewrite         : all Bucket 1 craft moves; full audit chain
#
# Class assignment requires defect_evidence (line anchors + rule-12 value verdicts).
# Reclassification requires a recorded reason and reviewer.

