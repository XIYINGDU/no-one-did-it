# 翻译术语表 — 所有译者的共享真相源
#
# 规则：
# 1. 术语表一旦锁定，Translator 只有使用权没有修改权
# 2. 任何术语修改必须经过 Glossary Master
# 3. forbidden 字段列出禁止使用的替代译法
# 4. 每个术语标注 first_chapter（首次出现的章节）和 domain（所属领域）

# === 词源讨论段落的外文词汇策略（全书统一） ===
#
# 当正文段落的论证对象是某个外文词汇本身时（如词源讨论），适用以下规则：
# 1. 被讨论的外文词汇以斜体保留原文形式——这些词本身就是讨论的对象/内容，不可翻译
# 2. 正文中文叙事提供足够上下文，使不读该外文的读者能理解论证线索
# 3. 首次出现的词源性关键词汇在翻译笔记中给出详细解释
# 4. 不在正文中加括号注中文（避免打断以该词本身为讨论对象的论证流）
# 5. 此策略沿用于全书所有词源讨论段落

terms:

